server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    # Compression des fichiers texte.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Sonde de sante pour Docker et le reverse proxy.
    location = /sante {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Lus par l'application et la page d'achat : toujours revalides.
    location ~* ^/clipotheque/(version\.json|config\.js)$ {
        include /etc/nginx/securite.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Images, polices et video : cache d'une semaine.
    location ~* \.(jpg|jpeg|png|webp|svg|woff2|mp4)$ {
        include /etc/nginx/securite.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/securite.conf;
        try_files $uri $uri/ =404;
    }
}
